name: care-qr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careqr
      POSTGRES_USER: careqr
      POSTGRES_PASSWORD: careqr
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careqr -d careqr']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - care-qr-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - care-qr-redis:/data

volumes:
  care-qr-postgres:
  care-qr-redis:
