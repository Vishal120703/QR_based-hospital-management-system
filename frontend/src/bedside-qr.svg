<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="headboard" x1="246" y1="44" x2="500" y2="277" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F3F6"/>
      <stop offset="1" stop-color="#ADCBD9"/>
    </linearGradient>
    <linearGradient id="frame" x1="94" y1="222" x2="460" y2="395" gradientUnits="userSpaceOnUse">
