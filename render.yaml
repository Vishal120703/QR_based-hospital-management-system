# Render Blueprint for the CARE QR API.
# Render dashboard → New → Blueprint → choose this repository. When asked,
# set DATABASE_URL to your PostgreSQL connection string (the live deployment
# uses Neon) and PUBLIC_APP_URL to the web app's address (the Vercel URL).
# This file never creates or replaces a database: DATABASE_URL is entered by
# you once and is not overwritten when the Blueprint syncs.
# Step-by-step guide: docs/deployment.md
services:
  - type: web
    name: careqr-api
    runtime: node
    rootDir: services
    # Free instances sleep after 15 minutes without traffic: the first request
    # then waits about a minute, and the SLA worker (escalations) does not run
    # while asleep. Use an always-on instance for a hospital pilot.
    plan: free
    # Dev dependencies are needed to build (TypeScript, Prisma CLI).
    buildCommand: npm ci --include=dev && npm run build
    # Applies new database migrations, then starts the API.
    startCommand: npm run start:prod
    # Liveness only: a database outage must not restart a healthy process.
    # Point uptime monitoring at /ready, which also checks PostgreSQL.
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Your PostgreSQL connection string, entered once in the dashboard. It
      # must include sslmode=require (or verify-ca/verify-full).
      - key: DATABASE_URL
        sync: false
      # Generate once with `openssl rand -base64 32`; keep it stable so active
      # bedside QR labels remain reprintable.
      - key: QR_TOKEN_ENCRYPTION_KEY
        sync: false
      # The web app address, e.g. https://care-qr.vercel.app (no trailing slash).
      - key: PUBLIC_APP_URL
        sync: false
      # Optional: other web addresses allowed to call the API, comma-separated.
      - key: CORS_ORIGINS
        sync: false
      # Requests reach the API through Cloudflare, Render's load balancer, and
      # a local proxy, so rate limits must look three hops back for the
      # visitor's own address.
      - key: TRUST_PROXY
        value: "3"
